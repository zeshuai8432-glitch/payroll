<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>工程進度請款系統</title>
<style>
:root{
  --bg:#0f172a; --card:#1e293b; --card2:#243247; --line:#334155;
  --ink:#e2e8f0; --muted:#94a3b8; --accent:#3b82f6; --accent2:#60a5fa;
  --ok:#34d399; --warn:#fbbf24; --bad:#f87171;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;background:linear-gradient(160deg,#0f172a,#1e1b4b 130%);color:var(--ink);min-height:100vh;font-size:15px}
.top{display:flex;align-items:center;gap:12px;padding:12px 18px;background:rgba(15,23,42,.85);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;flex-wrap:wrap}
.top h1{font-size:18px;letter-spacing:1px}
.top .ver{font-size:11px;color:var(--muted)}
.wrap{max-width:1180px;margin:0 auto;padding:16px}
.tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.tab{padding:8px 16px;border-radius:10px;background:var(--card);border:1px solid var(--line);color:var(--muted);cursor:pointer;font-size:14px}
.tab.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.card h3{font-size:15px;margin-bottom:10px;color:var(--accent2)}
.btn{display:inline-block;padding:8px 14px;border-radius:9px;border:none;background:var(--accent);color:#fff;font-size:14px;cursor:pointer;font-family:inherit}
.btn.sub{background:var(--card2);color:var(--ink);border:1px solid var(--line)}
.btn.warn{background:#b45309}
.btn.bad{background:#b91c1c}
.btn.sm{padding:4px 10px;font-size:12.5px;border-radius:7px}
input,select{background:#0f172a;border:1px solid var(--line);border-radius:8px;color:var(--ink);padding:7px 9px;font-size:14px;font-family:inherit}
input:focus,select:focus{outline:none;border-color:var(--accent)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{color:var(--muted);font-weight:600;font-size:12.5px;white-space:nowrap}
td.num,th.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .ok{color:var(--ok)} .warn-t{color:var(--warn)} .bad-t{color:var(--bad)}
.tag{display:inline-block;padding:1px 7px;border-radius:99px;font-size:11px;background:var(--card2);border:1px solid var(--line);color:var(--muted);margin-left:6px}
details.blk{border:1px solid var(--line);border-radius:12px;margin-bottom:10px;background:var(--card)}
details.blk>summary{cursor:pointer;padding:10px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;list-style:none}
details.blk>summary::-webkit-details-marker{display:none}
details.blk>summary::before{content:'▸';color:var(--muted)}
details.blk[open]>summary::before{content:'▾'}
details.blk .inner{padding:0 14px 12px;overflow-x:auto}
.chapter td{background:var(--card2);color:var(--accent2);font-size:12.5px;font-weight:600}
.rowline{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.stat{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px 14px;min-width:150px}
.stat .l{font-size:12px;color:var(--muted)} .stat .v{font-size:18px;font-weight:700;margin-top:2px}
.grid{display:flex;gap:10px;flex-wrap:wrap}
.pin{width:86px;text-align:right}
.pin.pct{width:70px}
.zero{opacity:.45}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:flex;align-items:center;justify-content:center;padding:20px}
#modal .box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;max-width:760px;width:100%;max-height:85vh;overflow:auto}
.notice{background:rgba(251,191,36,.08);border:1px solid rgba(251,191,36,.35);border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:10px}
/* ── 列印 ── */
#print-overlay{display:none}
.pbar{position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;z-index:5}
/* @page 放最外層：巢狀在 @media print 裡部分瀏覽器會忽略，頁首(網頁標題)/頁尾(網址)就又跑出來 */
@page{size:A4;margin:0}
@media print{
  body{background:#fff}
  body.printing>*{display:none!important}
  body.printing #print-overlay{display:block!important;position:static!important;background:#fff!important;min-height:0!important}
  .pbar{display:none!important}
  .pdoc{width:auto!important;min-height:0!important;margin:0!important;padding:12mm!important}  /* 留白改由單子內距補回 */
  .pdoc table{break-inside:auto}
  .pdoc tr{break-inside:avoid;page-break-inside:avoid}
  .pdoc thead{display:table-header-group}
  .pdoc .tot td,.pdoc .bhead td,.pdoc .bchap td{break-inside:avoid}
}
body.printing>*{display:none}
body.printing #print-overlay{display:block;position:absolute;inset:0;background:#f1f5f9;z-index:100;min-height:100vh}
.pdoc{background:#fff;color:#111;width:210mm;min-height:290mm;margin:0 auto;padding:14mm 14mm 12mm;font-size:12px;line-height:1.5;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.pdoc h2{font-size:18px;text-align:center;letter-spacing:4px;margin-bottom:2px;color:#1e3a8a}
.pdoc .sub{text-align:center;color:#64748b;font-size:11px;margin-bottom:10px}
.pdoc table{width:100%;border-collapse:collapse;font-size:11px;margin-bottom:10px}
.pdoc th,.pdoc td{border:1px solid #c7d4e8;padding:3px 5px;color:#111}
.pdoc th{background:#e8f0fb;color:#1e3a8a;font-size:10.5px}
.pdoc td.num,.pdoc th.num{text-align:right;font-variant-numeric:tabular-nums}
.pdoc .bchap td{background:#f6f9fd;color:#3b5b8f;font-weight:600}
.pdoc .bhead td{background:#dbe7f6;color:#1e3a8a;font-weight:700}
.pdoc .tot td{font-weight:700;background:#fbf7ea;color:#6b5312}
.pdoc .sign{display:flex;gap:24px;margin-top:26px;break-inside:avoid;page-break-inside:avoid}
.pdoc .sign>div{flex:1;font-size:12px;text-align:center}
.pdoc .sign .sigslot{height:58px;display:flex;align-items:flex-end;justify-content:center}
.pdoc .sign .sigslot img{max-height:56px;max-width:100%}
.pdoc .sign .lbl{border-top:1px solid #334155;color:#1f2937;padding-top:6px;margin-top:2px}
@media print{.no-print{display:none!important}}
#sigmodal{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:200;display:flex;align-items:center;justify-content:center;padding:14px}
#sigmodal .sbox{background:#fff;border-radius:14px;padding:14px;max-width:640px;width:100%}
#sigmodal canvas{width:100%;height:auto;border:1.5px dashed #94a3b8;border-radius:10px;background:#fff;touch-action:none;display:block}
#sigmodal .srow{display:flex;gap:10px;margin-top:10px;align-items:center}
#sigmodal .stitle{color:#111;font-size:14px;font-weight:700;margin-bottom:8px}
@media screen and (max-width:760px){ .pdoc{width:100%;min-height:auto;padding:16px} }
</style>

<body>
<div class="top">
  <h1>📐 工程進度請款系統</h1>
  <span class="ver" id="ver"></span>
  <span class="ver" id="cloud-status" style="cursor:pointer" title="點一下重試連線/解鎖"></span>

<input type="file" id="xlsx-file" accept=".xlsx" style="display:none">

<script>
'use strict';
const APP_VERSION='vG2026.08.06h-submerge';
document.getElementById('ver').textContent=APP_VERSION;
const LS='pm_progress_v1';
const FS_KEY='AIzaSyAfEIRpVSpnHfIX0fqb37iUkf3mv_Od9S8';
const FS_URL='https://firestore.googleapis.com/v1/projects/payroll-d1abe/databases/(default)/documents/progress/main?key='+FS_KEY;
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'$'+Math.round(n||0).toLocaleString('en-US');
const moneyS=n=>{n=Math.round(n||0);return (n<0?'-$':'$')+Math.abs(n).toLocaleString('en-US');}; // 帶正負號（扣抵為負）
const num=v=>{const n=parseFloat(String(v??'').replace(/,/g,''));return isFinite(n)?n:0;};
// 支援計算式：5.11*3.07、1.2+0.8 等（只允許數字與 + - * / ( )）
const evalExpr=v=>{
  let s=String(v??'').trim().replace(/×/g,'*').replace(/÷/g,'/').replace(/[，,\s]/g,'');
  if(s==='')return 0;
  if(/^[0-9+\-*/().]+$/.test(s)){ try{ const r=Function('"use strict";return('+s+')')(); if(typeof r==='number'&&isFinite(r)) return Math.round(r*10000)/10000; }catch(e){} }
  return num(s);
};
const hasExpr=v=>/[+\-*/()×÷]/.test(String(v||'').replace(/^\s*-?\d/,'')); // 有運算符（開頭負號不算）
const qfmt=n=>{n=+(+n||0).toFixed(2);return n.toLocaleString('en-US',{maximumFractionDigits:2});};
const pfmt=p=>{const v=+(p*100).toFixed(1);return (Number.isInteger(v)?v.toFixed(0):v.toFixed(1))+'%';};
const today=()=>new Date().toISOString().slice(0,10);

let state=load();
function load(){
  try{const d=JSON.parse(localStorage.getItem(LS)||'null');if(d&&Array.isArray(d.projects))return d;}catch(e){}
  return {projects:[],cur:null,tab:'items'};
}
function save(){ state.savedAt=Date.now(); localStorage.setItem(LS,JSON.stringify(state)); schedulePush(); }
const curProj=()=>state.projects.find(p=>p.id===state.cur)||null;

/* ═══════════ xlsx 解析（純瀏覽器，不用外部程式庫） ═══════════ */
async function unzip(buf){
  const dv=new DataView(buf),u8=new Uint8Array(buf);
  let e=-1;
  for(let i=buf.byteLength-22;i>=Math.max(0,buf.byteLength-22-65536);i--){ if(dv.getUint32(i,true)===0x06054b50){e=i;break;} }
  if(e<0)throw new Error('不是有效的 xlsx 檔');
  const count=dv.getUint16(e+10,true);let off=dv.getUint32(e+16,true);
  const td=new TextDecoder();const entries={};
  for(let i=0;i<count;i++){
    if(dv.getUint32(off,true)!==0x02014b50)throw new Error('xlsx 目錄損壞');
    const method=dv.getUint16(off+10,true),csize=dv.getUint32(off+20,true),
      nlen=dv.getUint16(off+28,true),elen=dv.getUint16(off+30,true),clen=dv.getUint16(off+32,true),
      lho=dv.getUint32(off+42,true);
    entries[td.decode(u8.subarray(off+46,off+46+nlen))]={method,csize,lho};
    off+=46+nlen+elen+clen;
  }
  return {
    async text(name){
      const en=entries[name];if(!en)return null;
      const lnlen=dv.getUint16(en.lho+26,true),lelen=dv.getUint16(en.lho+28,true);
      const start=en.lho+30+lnlen+lelen;
      const data=u8.slice(start,start+en.csize);
      if(en.method===0)return td.decode(data);
      if(en.method!==8)throw new Error('不支援的壓縮方式');
      return await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text();
    },
    names:Object.keys(entries)
  };
}
const colIdx=ref=>{let n=0;for(const ch of ref){const c=ch.charCodeAt(0);if(c>=65&&c<=90)n=n*26+c-64;else break;}return n;};
function parseSheetXml(xml,sst){
  const doc=new DOMParser().parseFromString(xml,'application/xml');
  const rows={};let maxR=0;
  for(const c of doc.getElementsByTagName('c')){
    const ref=c.getAttribute('r');if(!ref)continue;
    const col=colIdx(ref),r=parseInt(ref.replace(/^[A-Z]+/,''),10);
    const t=c.getAttribute('t');let v=null;
    if(t==='inlineStr'){ v=Array.from(c.getElementsByTagName('t')).map(x=>x.textContent).join(''); }
    else{
      const vEl=c.getElementsByTagName('v')[0];if(!vEl)continue;
      const raw=vEl.textContent;
      if(t==='s')v=sst[+raw]??'';
      else if(t==='str')v=raw;
      else if(t==='b')v=raw==='1';
      else v=parseFloat(raw);
    }
    if(v===null||v==='')continue;
    (rows[r]||(rows[r]={}))[col]=v;
    if(r>maxR)maxR=r;
  }
  return {rows,maxR};
}
async function readXlsx(buf){
  const z=await unzip(buf);
  const wbXml=await z.text('xl/workbook.xml');
  const relXml=await z.text('xl/_rels/workbook.xml.rels');
  if(!wbXml||!relXml)throw new Error('讀不到活頁簿結構');
  const rels={};
  for(const m of relXml.matchAll(/<Relationship[^>]*Id="([^"]+)"[^>]*Target="([^"]+)"/g)) rels[m[1]]=m[2];
  const sheets=[];
  for(const m of wbXml.matchAll(/<sheet[^>]*name="([^"]+)"[^>]*r:id="([^"]+)"/g)){
    let t=rels[m[2]]||'';if(t.startsWith('/'))t=t.slice(1);else if(!t.startsWith('xl/'))t='xl/'+t;
    sheets.push({name:m[1].replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>'),target:t});
  }
  let sst=[];
  const sstXml=await z.text('xl/sharedStrings.xml');
  if(sstXml){
    const doc=new DOMParser().parseFromString(sstXml,'application/xml');
    sst=Array.from(doc.getElementsByTagName('si')).map(si=>Array.from(si.getElementsByTagName('t')).map(t=>t.textContent).join(''));
  }
  const out=[];
  for(const s of sheets){
    const xml=await z.text(s.target);if(!xml)continue;
    const parsed=parseSheetXml(xml,sst);
    out.push({name:s.name,rows:parsed.rows,maxR:parsed.maxR});
  }
  return out;
}

/* ═══════════ 合約結構分析 ═══════════ */
const KANJI=/^[一二三四五六七八九十]+$/;
const SUBHD=/^[（(][一二三四五六七八九十]+[)）]$/;
function detectCols(rows,maxR){
  // 找表頭列（含 單位＋數量），對照欄位；找不到就用預設 B~H
  for(let r=1;r<=Math.min(maxR,30);r++){
    const row=rows[r];if(!row)continue;
    const vals=Object.entries(row).map(([c,v])=>[+c,String(v)]);
    const find=kw=>{const hit=vals.find(([c,v])=>v.includes(kw));return hit?hit[0]:0;};
    if(find('單位')&&find('數量')){
      return {
        no:find('項目')||find('Item')||2,
        name:find('名')||find('規格')||3,
        unit:find('單位'),qty:find('數量'),
        price:find('單價'),amt:find('總價')||find('複價')||find('金額'),
        remark:find('備註')||find('Remark')||8,
        tag:Math.max(1,(find('項目')||2)-1)
      };
    }
  }
  return {tag:1,no:2,name:3,unit:4,qty:5,price:6,amt:7,remark:8};
}
function analyzeSheet(sheet){
  const {rows,maxR}=sheet;
  const C=detectCols(rows,maxR);
  const cell=(r,k)=>{const row=rows[r];return row?row[C[k]]:undefined;};
  const txt=(r,k)=>String(cell(r,k)??'').trim();
  const isNum=v=>typeof v==='number'&&isFinite(v);
  // ① 找區塊：名稱以「合計」結尾、單位為 間/層、數量為正數
  const blocks=[];const subtotals={};
  for(let r=1;r<=maxR;r++){
    const name=txt(r,'name');if(!name)continue;
    if(/小\s*計\s*$/.test(name)){
      const key=name.replace(/小\s*計\s*$/,'').trim();
      if(key&&isNum(cell(r,'amt')))subtotals[key]=cell(r,'amt');
      continue;
    }
    if(/合\s*計\s*$/.test(name)){
      const unit=txt(r,'unit'),qty=cell(r,'qty');
      if((unit==='間'||unit==='層')&&isNum(qty)&&qty>0){
        const key=name.replace(/合\s*計\s*$/,'').trim();
        blocks.push({key,unit,count:qty,row:r,amount:isNum(cell(r,'amt'))?cell(r,'amt'):0,headerRow:0,display:key});
      }
    }
  }
  blocks.sort((a,b)=>a.row-b.row);
  // ② 找每個區塊的標題列（合計列往前找同名獨立列，例：TYPE-SK 標準大床）
  for(const b of blocks){
    for(let r=b.row-1;r>=Math.max(1,b.row-400);r--){
      const name=txt(r,'name');
      if(name&&name.startsWith(b.key)&&!/[小合]\s*計/.test(name)&&!isNum(cell(r,'qty'))){
        b.headerRow=r;b.display=name;break;
      }
    }
  }
  // ③ 撈細項：每個區塊的細項在「該區塊合計列之後、下一區塊標題列之前」
  const warnings=[];const outBlocks=[];
  const grabItems=(r1,r2)=>{
    let chapter='';const items=[];
    for(let r=r1;r<=r2;r++){
      const name=txt(r,'name');if(!name)continue;
      const no=txt(r,'no');
      if(KANJI.test(no)){chapter=name;continue;}
      if(SUBHD.test(no)){continue;}
      if(/[小合]\s*計\s*$/.test(name)||/^總\s*價/.test(name))continue;
      const qty=cell(r,'qty');
      if(!isNum(qty))continue;
      const price=isNum(cell(r,'price'))?cell(r,'price'):0;
      let amt=isNum(cell(r,'amt'))?cell(r,'amt'):qty*price;
      items.push({id:uid(),no,tag:txt(r,'tag'),chapter,name,unit:txt(r,'unit'),qty,price,amount:amt,remark:txt(r,'remark')});
    }
    return items;
  };
  for(let i=0;i<blocks.length;i++){
    const b=blocks[i];
    const next=blocks[i+1];
    const end=next?(next.headerRow||next.row)-1:maxR;
    const items=grabItems(b.row+1,end);
    const sum=items.reduce((s,it)=>s+it.amount,0);
    const sub=subtotals[b.key];
    if(sub!==undefined&&Math.abs(sum-sub)>1)
      warnings.push(`「${b.display}」細項加總 ${money(sum)} 與合約小計 ${money(sub)} 不符，請匯入後檢查`);
    outBlocks.push({id:uid(),name:b.display,unit:b.unit,count:b.count,contractAmt:b.amount||sum*b.count,items});
  }
  // 沒抓到任何區塊 → 全部細項當一個區塊
  if(!outBlocks.length){
    const items=grabItems(1,maxR);
    if(items.length)outBlocks.push({id:uid(),name:'全部項目',unit:'式',count:1,contractAmt:items.reduce((s,i)=>s+i.amount,0),items});
  }
  // 專案名稱猜測：前幾列最長的文字
  let title='';
  for(let r=1;r<=5;r++){for(const k of['no','name']){const t=txt(r,k);if(t.length>title.length&&!t.includes('單位'))title=t;}}
  // 總價列
  let grand=0;
  for(let r=1;r<=Math.min(maxR,30);r++){ if(/^總\s*價/.test(txt(r,'name'))){const v=cell(r,'amt');if(isNum(v))grand=v;break;} }
  return {blocks:outBlocks,warnings,title,grand};
}

/* ═══════════ 計算 ═══════════ */
const itemTotalQty=(it,blk)=>it.qty*blk.count;
// 改「間數」時保住歷史：各期進度存的是百分比 p（總量的幾成），總量＝單間數量×間數。
// 間數一變，同一個 p 換算出來的數量與金額就跟著變，已經請過款的舊期會被追溯改掉。
// 這裡改用各期存下來的絕對數量 q 回推新的 p，讓舊期的完成量原封不動。
function rescaleBlockProgress(proj,blk,newCount){
  if(!proj||!blk||!Array.isArray(proj.periods)) return 0;
  let n=0;
  for(const per of proj.periods){
    if(!per||!per.prog) continue;
    for(const it of (blk.items||[])){
      const pr=per.prog[it.id]; if(!pr) continue;
      const oldTotal=(Number(it.qty)||0)*(Number(blk.count)||0);
      const newTotal=(Number(it.qty)||0)*newCount;
      const doneQty=(pr.q!==undefined&&pr.q!==null)?Number(pr.q):(Number(pr.p)||0)*oldTotal; // 舊資料沒存 q 就用 p 回推
      if(newTotal>0){ pr.p=Math.min(doneQty/newTotal,1); pr.q=+doneQty.toFixed(2); }
      else { pr.p=0; pr.q=0; }
      n++;
    }
  }
  return n;
}
const itemValue=(it,blk)=>it.amount*blk.count;
// 該期保留款：period.rtAmt 有填就直接用（湊整數用），否則照專案的％算
const retainOf=(proj,period,base)=>{
  if(period&&period.rtAmt!==undefined&&period.rtAmt!=='') return Math.max(0,Math.round(Number(period.rtAmt)||0));
  const pct=Math.max(0,Number(proj.retainPct)||0);
  return pct>0?Math.round(base*pct/100):0;
};

/* ═══════════ 母子專案（母＝發包總表／子＝各廠商，子總和不得超過母） ═══════════ */
const childProjects = pid => state.projects.filter(p=>p.parentId===pid);
const parentProject = p => p&&p.parentId?state.projects.find(x=>x.id===p.parentId):null;
const isParent = p => p&&!p.parentId&&childProjects(p.id).length>0;
// 母每一條細項的「已分配」情形：各子專案照 srcId 認領的總量／總額
function allocationOf(parent){
  const kids=childProjects(parent.id);
  const map={}; // srcId -> {qty, amount, by:[{name,qty,amount}]}
  kids.forEach(k=>{
    k.blocks.forEach(b=>b.items.forEach(it=>{
      const src=it.srcId; if(!src) return;
      const e=map[src]||(map[src]={qty:0,amount:0,by:[],refs:[]});
      const q=(Number(it.qty)||0)*(Number(b.count)||0);      // 子的總量（單間量×間數）
      const a=(Number(it.amount)||0)*(Number(b.count)||0);
      e.qty+=q; e.amount+=a;
      e.refs.push({projId:k.id,projName:k.name,blkName:b.name,item:it,name:it.name,amount:a});
      const hit=e.by.find(x=>x.id===k.id);
      if(hit){ hit.qty+=q; hit.amount+=a; } else e.by.push({id:k.id,name:k.name,qty:q,amount:a});
    }));
  });
  // 超額判斷用「金額」：子專案可能把一條拆成骨架／封板，數量會變兩倍但金額仍相加，
  // 用金額比才不會誤報（140×12＋140×12 ＝ 280×12）。數量僅供參考顯示。
  const rows=[]; let over=0, totMother=0, totAlloc=0, totSelf=0;
  const seen=new Set();
  parent.blocks.forEach(b=>b.items.forEach(it=>{
    const mQty=(Number(it.qty)||0)*(Number(b.count)||0), mAmt=itemValue(it,b);
    const e=map[it.id]||{qty:0,amount:0,by:[]};
    seen.add(it.id);
    // 自辦：這條有多少量是自己做的（不發包）。單位與「已分配量」相同（單間量×間數）
    const unitPrice=mQty?mAmt/mQty:0;
    const selfQty=Math.max(0, Math.min(Number(it.selfQty)||0, mQty));
    const selfAmt=selfQty*unitPrice;
    totMother+=mAmt; totAlloc+=e.amount; totSelf+=selfAmt;
    const isOver=(e.amount+selfAmt)-mAmt>0.5;
    if(isOver) over++;
    rows.push({blk:b, it, mQty, mAmt, aQty:e.qty, aAmt:e.amount, by:e.by, selfQty, selfAmt, unitPrice,
               leftQty:+(mQty-e.qty-selfQty).toFixed(4), leftAmt:mAmt-e.amount-selfAmt, over:isOver});
  }));
  // 孤兒：子專案的 srcId 在母專案已找不到（多半是母那條被拆開或刪掉了），
  // 這些金額仍是實際發包出去的，要列出來提醒，不能默默消失。
  const orphans=[]; let orphanAmt=0;
  Object.keys(map).forEach(src=>{ if(!seen.has(src)){ orphans.push(map[src]); orphanAmt+=map[src].amount; } });
  return {rows, kids, over, totMother, totAlloc, totSelf, totLeft:totMother-totAlloc-totSelf, orphans, orphanAmt};
}
function periodOf(p,idx){return p.periods[idx]||null;}
function progOf(period,itemId){return (period&&period.prog&&period.prog[itemId])||{p:0,q:0};}
const extrasOf=period=>(period&&period.extras)||[]; // 額外款項（訂金／預付款等）
const exVal=e=>(+((e&&e.amount)||0))*(e&&e.deduct?-1:1); // 加項為正、扣抵(預付款)為負
const extrasSum=period=>extrasOf(period).reduce((s,e)=>s+exVal(e),0);
// 一個專案所有期別的「加項」合計（點工、修繕這種不按量算的錢，不在合約明細裡）
function projChargeTotal(p){
  let sum=0, days=0;
  (p&&p.periods||[]).forEach(pr=>extrasOf(pr).forEach(e=>{ if(e.deduct||e.auto) return; sum+=(+e.amount||0); days+=(+e.days||0); }));
  return {sum,days};
}
function calc(proj,perIdx){
  const period=proj.periods[perIdx];
  const prev=perIdx>0?proj.periods[perIdx-1]:null;
  // 各大項：累計完成計價（本期）與前期，供輸入表顯示
  const blocks=proj.blocks.map(blk=>{
    let V=0,cum=0,pre=0;
    const items=blk.items.map(it=>{
      const v=itemValue(it,blk);
      const p=progOf(period,it.id).p, pp=progOf(prev,it.id).p;
      const cumAmt=Math.round(v*p), preAmt=Math.round(v*pp);
      V+=v;cum+=cumAmt;pre+=preAmt;
      return {it,v,p,pp,cumAmt,preAmt,thisAmt:cumAmt-preAmt};
    });
    return {blk,V,cum,pre,thisAmt:cum-pre,pct:V?cum/V:0,items};
  });
  const V=blocks.reduce((s,b)=>s+b.V,0);
  const itemCum=blocks.reduce((s,b)=>s+b.cum,0), itemPre=blocks.reduce((s,b)=>s+b.pre,0);
  // 議價折數：簽約總價 ÷ 明細總額（明細不動、整體照比例折讓）；未填＝1（照明細）
  const factor=(proj.signedTotal>0&&V>0)?proj.signedTotal/V:1;
  const discount=factor!==1;
  // ── 現金制請款：折讓後累計計價 −（訂金＋前期各期實請）＝ 本次應請 ──
  const itemCumOf=idx=>{ if(idx<0)return 0; const per=proj.periods[idx]; let s=0; for(const blk of proj.blocks) for(const it of blk.items) s+=Math.round(itemValue(it,blk)*progOf(per,it.id).p); return s; };
  const sumDep=idx=>extrasOf(proj.periods[idx]).filter(e=>e.deduct&&!e.recordOnly&&!e.auto).reduce((s,e)=>s+(+e.amount||0),0); // 已收扣抵（減本次）
  const sumChg=idx=>extrasOf(proj.periods[idx]).filter(e=>!e.deduct&&!e.auto).reduce((s,e)=>s+(+e.amount||0),0); // 加項（追加，不折讓）
  let runningBilled=0, billPre=0, billComputed=0, billActual=0; const priorBills=[];
  for(let k=0;k<=perIdx;k++){
    let depLE=0,chgLE=0; for(let j=0;j<=k;j++){ depLE+=sumDep(j); chgLE+=sumChg(j); }
    const applied=Math.round(itemCumOf(k)*factor)+chgLE;   // 折讓後累計計價 ＋ 加項
    const received=depLE+runningBilled;    // 已收（訂金＋先前各期實請）
    const computed=applied-received;
    const tgt=proj.periods[k].roundTarget;
    const actual=(tgt!==undefined&&tgt!==null&&tgt!=='')?Math.round(num(tgt)):computed;
    if(k<perIdx) priorBills.push({label:`第 ${proj.periods[k].no} 期請款`,date:proj.periods[k].date||'',amount:actual});
    if(k===perIdx){ billPre=received; billComputed=computed; billActual=actual; }
    runningBilled+=actual;
  }
  const deposits=[]; for(let i=0;i<=perIdx;i++) for(const e of extrasOf(proj.periods[i])) if(e.deduct&&!e.recordOnly&&!e.auto) deposits.push({label:e.name||'訂金',date:e.date||'',amount:+e.amount||0});
  const receivedList=[...deposits,...priorBills];
  const noteList=[]; for(let i=0;i<=perIdx;i++) for(const e of extrasOf(proj.periods[i])) if(e.deduct&&e.recordOnly&&!e.auto) noteList.push({label:e.name||'訂金',date:e.date||'',amount:+e.amount||0}); // 已收但本次不扣，僅列紀錄
  const chargeList=[]; for(let i=0;i<=perIdx;i++) for(const e of extrasOf(proj.periods[i])) if(!e.deduct&&!e.auto) chargeList.push({label:e.name||'追加',date:e.date||'',amount:+e.amount||0,periodNo:proj.periods[i].no,days:+e.days||0,rate:+e.rate||0});
  const chgTotal=chargeList.reduce((s,e)=>s+e.amount,0);
  const cumRaw=itemCum+chgTotal;                       // 照明細（未折讓）的累計計價＋加項
  const cumDiscItem=Math.round(itemCum*factor);         // 折讓後的工程計價
  const cumApplied=cumDiscItem+chgTotal;                // 折讓後累計應請（供本次計算）
  const billRound=billActual-billComputed;
  return {blocks,V,itemCum,itemPre,cumRaw,cumDiscItem,cumApplied,factor,discount,signedTotal:proj.signedTotal||0,chgTotal,
          receivedList,noteList,chargeList,billPre,billComputed,billRound,billActual,cum:billPre+billActual,period,prev,
          thisAmt:billActual,pre:billPre};
}

// 工序名配色：同名永遠同色，方便在上千條裡快速掃到「骨架」「封板」
const STAGE_COLORS=['#60a5fa','#34d399','#fbbf24','#f472b6','#a78bfa','#22d3ee','#fb923c','#4ade80','#e879f9','#2dd4bf','#facc15','#93c5fd'];
const stageOf=(name,groupName)=>{ const g=String(groupName||''); const n=String(name||''); return (g&&n.startsWith(g+'-'))?n.slice(g.length+1):n; };
// 依「本專案實際出現過的工序名」依序配色：同專案內不同工序保證不同色（12 色內），
// 且順序由資料排序決定，重開也不會變。
let _stageMap={};
function buildStageMap(proj){
  const set=new Set();
  (proj&&proj.blocks||[]).forEach(b=>b.items.forEach(it=>{ if(it.groupId&&it.groupName) set.add(stageOf(it.name,it.groupName)); }));
  _stageMap={}; [...set].sort((a,b)=>a.localeCompare(b,'zh-Hant')).forEach((n,i)=>{ _stageMap[n]=i; });
}
// 列印用深色版（白紙上才看得清楚；順序與 STAGE_COLORS 對應）
const STAGE_COLORS_PRINT=['#1d4ed8','#047857','#b45309','#be185d','#6d28d9','#0e7490','#c2410c','#15803d','#a21caf','#0f766e','#a16207','#1e40af'];
const _stageIdx=n=>{ const i=_stageMap[String(n||'')]; return i===undefined?0:i; };
function stageColor(n){ return STAGE_COLORS[_stageIdx(n)%STAGE_COLORS.length]; }
function stageColorPrint(n){ return STAGE_COLORS_PRINT[_stageIdx(n)%STAGE_COLORS_PRINT.length]; }
const stageHtml=(name,groupName)=>{ const st=stageOf(name,groupName); return `<b style="color:${stageColor(st)}">${esc(st)}</b>`; };

// 專案裡出現過的工序名（骨架／塞棉／封板…），依金額排序，給「依工序批次標工班」用
function stageBuckets(proj){
  const m={};
  (proj.blocks||[]).forEach(b=>b.items.forEach(it=>{
    if(!it.groupId||!it.groupName) return;
    const st=stageOf(it.name,it.groupName); if(!st) return;
    const e=m[st]||(m[st]={name:st,n:0,amount:0});
    e.n++; e.amount+=itemValue(it,b);
  }));
  return Object.values(m).sort((a,b)=>b.amount-a.amount);
}
const openBlk=new Set();
const openGroup=new Set(); // 拆開的工序群組：展開狀態
// 舊資料回溯：找出「以前拆過但沒有群組標記」的細項（名稱同前綴＋相鄰＋單位數量一致）
const projectSplitRuns = proj => proj.blocks.reduce((s,b)=>s+detectSplitRuns(b).length,0);
function detectSplitRuns(b){
  const runs=[]; let cur=null;
  const pre=n=>{ const i=String(n||'').lastIndexOf('-'); return i>0?String(n).slice(0,i):null; };
  for(const it of b.items){
    const p=it.groupId?null:pre(it.name);
    if(p&&cur&&cur.prefix===p&&cur.unit===it.unit){ cur.items.push(it); continue; }
    if(cur&&cur.items.length>1) runs.push(cur);
    cur=p?{prefix:p,unit:it.unit,items:[it]}:null;
  }
  if(cur&&cur.items.length>1) runs.push(cur);
  return runs;
}

/* ── 發包精靈：（房型 × 工序 × 間數）──

const SUB_ALL='*';  // 「整條發包」的虛擬工序代碼
function buildSubInfo(proj){
  const al=allocationOf(proj);
  const byId={}; al.rows.forEach(r=>{ byId[r.it.id]=r; });
  _subInfo={};
  proj.blocks.forEach(b=>{
    const m={}; _subInfo[b.id]=m;
    const add=(key,it)=>{
      const e=m[key]||(m[key]={rooms:Number(b.count)||0,used:0,perRoom:0,n:0});
      e.perRoom+=Number(it.amount)||0; e.n++;
      const r=byId[it.id], q=Number(it.qty)||0;
      if(r&&q) e.used=Math.max(e.used, +(r.aQty/q).toFixed(2));   // 已發包量換算回間數
    };
    b.items.forEach(it=>{
      if(!(Number(it.amount)>0)) return;
      add(SUB_ALL,it);
      if(it.groupId&&it.groupName) add(stageOf(it.name,it.groupName),it);
    });
  });
}

      <button class="btn sub sm" id="sub-fillall">全部填滿（每個房型都發包全部間數）</button>

    <div class="rowline" style="gap:6px;align-items:center;margin-top:6px;font-size:13px">
      備註 <input id="sub-note" placeholder="例：13F" style="height:30px;min-width:160px">
      <span class="muted" style="font-size:12px">會寫進細項備註與區塊名稱，方便日後認出是哪一批。</span></div>`;

    <div class="muted" style="font-size:11.5px;margin-top:6px">建好之後到「發包分配」分頁，可以看到每一條發了幾間、還剩多少沒發。剩下自己做的部分在那裡填「自辦」。</div></div>`;

// 面板是動態算的（勾選工序會改變已發包間數與預估金額），render 後綁一次
function bindSubPanel(){
  const upd=()=>{
    const stages=[...document.querySelectorAll('[data-substage]:checked')].map(x=>x.dataset.substage);
    const whole=(document.getElementById('sub-whole')||{}).checked;
    const keys=whole?[SUB_ALL]:stages;
    const pct=(evalExpr((document.getElementById('sub-pct')||{}).value)||100)/100;
    let tot=0;
    document.querySelectorAll('[data-subroom]').forEach(inp=>{
      const bid=inp.dataset.subroom, info=_subInfo[bid]||{};
      let perRoom=0, used=0, any=false;
      keys.forEach(k=>{ const e=info[k]; if(!e) return; any=true; perRoom+=e.perRoom; used=Math.max(used,e.used); });
      const n=Math.max(0, evalExpr(inp.value)||0);
      const amt=Math.round(perRoom*n*pct);
      tot+=amt;
      const uEl=document.querySelector(`[data-subused="${bid}"]`);
      if(uEl) uEl.textContent=!keys.length?'—':(any?(used?qfmt(used)+' 間':'0'):'無此工序');
      const aEl=document.querySelector(`[data-subamt="${bid}"]`);
      if(aEl) aEl.textContent=amt?money(amt):'—';
      const row=document.querySelector(`[data-subrow="${bid}"]`);
      if(row){ const cap=(_subInfo[bid]&&_subInfo[bid][SUB_ALL]||{}).rooms||0;
        row.style.background=(n>cap-used+0.001&&n>0)?'rgba(248,113,113,.12)':''; }
    });
    const tEl=document.querySelector('[data-subtotal]');
    if(tEl) tEl.textContent=money(tot);
  };
  document.querySelectorAll('[data-substage],#sub-whole').forEach(el=>el.onchange=upd);
  document.querySelectorAll('[data-subroom],#sub-pct').forEach(el=>el.oninput=upd);
  const ff=document.getElementById('sub-fillall');
  if(ff) ff.onclick=()=>{ document.querySelectorAll('[data-subroom]').forEach(inp=>{
      const info=_subInfo[inp.dataset.subroom]||{}; inp.value=(info[SUB_ALL]||{}).rooms||''; }); upd(); };
  const cl=document.getElementById('sub-clear');
  if(cl) cl.onclick=()=>{ document.querySelectorAll('[data-subroom]').forEach(inp=>inp.value=''); upd(); };
  upd();
}
function doSubcontract(proj){
  const stages=[...document.querySelectorAll('[data-substage]:checked')].map(x=>x.dataset.substage);
  const whole=(document.getElementById('sub-whole')||{}).checked;
  if(!whole&&!stages.length){ alert('請至少勾一道工序，或勾「整條發包」。'); return; }
  const rooms={};
  document.querySelectorAll('[data-subroom]').forEach(inp=>{ const n=Math.max(0,evalExpr(inp.value)||0); if(n>0) rooms[inp.dataset.subroom]=n; });
  if(!Object.keys(rooms).length){ alert('請至少在一個房型填「這次發包幾間」。'); return; }
  const pct=(evalExpr(document.getElementById('sub-pct').value)||100)/100;
  const note=document.getElementById('sub-note').value.trim();
  const kidId=document.getElementById('sub-kid').value;
  let kid=kidId?state.projects.find(p=>p.id===kidId):null;
  const vendor=document.getElementById('sub-vendor').value.trim()||(kid&&kid.vendor)||'';
  if(!kid&&!vendor){ alert('請填工班名稱。'); return; }

  const match = it => Number(it.amount)>0 && (whole || (it.groupId&&it.groupName&&stages.includes(stageOf(it.name,it.groupName))));
  const parts=[];
  proj.blocks.forEach(b=>{ const n=rooms[b.id]; if(!n) return;
    const its=b.items.filter(match); if(its.length) parts.push({b,n,its}); });
  if(!parts.length){ alert('填了間數的房型裡，沒有符合所選工序的細項。\n\n請確認勾的工序在那些房型底下確實存在。'); return; }

  // 先排好計畫：能併進現有區塊的就併（沿用原議定單價），不能的才新開一個區塊。
  // 這樣「這期又發他幾間」不會每次都多長一個區塊，單價也不會被母單價蓋掉。
  const wantMerge=(document.getElementById('sub-merge')||{}).checked;
  const plan=parts.map(({b,n,its})=>{
    let tb=null;
    if(wantMerge&&kid){
      const srcIds=new Set(its.map(x=>x.id));
      // 同一母區塊、且細項組合完全一樣（同一批工序）才算「同一種發包」，可以直接加間數
      tb=kid.blocks.find(x=>(x.srcBlk===b.id||x.name===b.name)
        && x.items.length===srcIds.size && x.items.every(i=>i.srcId&&srcIds.has(i.srcId)));
    }
    return {b,n,its,tb};
  });
  const label=whole?'整條（所有細項）':stages.join('、');
  const amt=plan.reduce((s,x)=>{
    const unit=x.tb
      ? x.tb.items.reduce((y,i)=>y+(Number(i.amount)||0),0)          // 併進去＝沿用原議定單價
      : x.its.reduce((y,it)=>y+(Number(it.amount)||0),0)*pct;
    return s+unit*x.n;
  },0);
  const summary=plan.map(x=>x.tb
    ? `・${x.b.name}　併進現有區塊「${x.tb.name}」　${qfmt(x.tb.count)} → ${qfmt((Number(x.tb.count)||0)+x.n)} ${x.b.unit}（沿用原單價）`
    : `・${x.b.name}　新開區塊　${qfmt(x.n)} ${x.b.unit}　${x.its.length} 條（母單價 × ${Math.round(pct*100)}%）`).join('\n');
  const nMerge=plan.filter(x=>x.tb).length;
  if(!confirm(`${kid?`併進子專案「${kid.name}」`:`建立子專案（工班：${vendor}）`}？\n\n工序：${label}\n${summary}\n${nMerge?'\n併進去的區塊沿用原本議定的單價，舊期已請的金額不會變。\n':''}\n預估增加發包金額：${money(Math.round(amt))}`)) return;

  const isNew=!kid;
  if(isNew){
    kid={ id:uid(), name:(proj.name+'-'+(vendor||'發包')+(note?'（'+note+'）':'')), owner:proj.owner||'', vendor,
          taxMode:proj.taxMode||'excl', signedTotal:0, blocks:[], periods:[], curPeriod:0,
          createdAt:Date.now(), parentId:proj.id };
    state.projects.push(kid);
  }else if(vendor&&!kid.vendor) kid.vendor=vendor;

  let added=0, skipped=0; const grown=[];
  plan.forEach(({b,n,its,tb:hit})=>{
    // ① 併進現有區塊：只加間數，細項與單價都不動。
    //    rescaleBlockProgress 用各期存下來的絕對完成量回推百分比，舊期已請的金額不會被改到。
    if(hit){
      const old=Number(hit.count)||0, nv=+(old+n).toFixed(4);
      rescaleBlockProgress(kid,hit,nv);
      hit.count=nv; hit.countExpr='';
      grown.push(`${hit.name} ${qfmt(old)} → ${qfmt(nv)} ${b.unit}`);
      return;
    }
    // ② 新開區塊：間數是區塊層級的，同一房型不同批必須分開
    let tb=kid.blocks.find(x=>(x.srcBlk===b.id||x.name===b.name)&&Number(x.count)===n&&(x.subNote||'')===note);
    if(!tb){
      let nm=b.name+(note?`（${note}）`:'');
      if(kid.blocks.some(x=>x.name===nm)) nm+=`·${qfmt(n)}${b.unit}`;
      let k=2; while(kid.blocks.some(x=>x.name===nm)){ nm=b.name+(note?`（${note}）`:'')+`·${qfmt(n)}${b.unit}(${k++})`; }
      tb={id:uid(),name:nm,unit:b.unit,count:n,srcBlk:b.id,subNote:note,items:[]};
      kid.blocks.push(tb);
    }
    const gmap={};
    its.forEach(it=>{
      if(tb.items.some(x=>x.srcId===it.id)){ skipped++; return; }   // 這批已經帶過了
      const price=+((Number(it.price)||0)*pct).toFixed(4);
      tb.items.push({ id:uid(), no:it.no, tag:'', chapter:it.chapter||'', name:it.name, unit:it.unit,
        qty:it.qty, qtyExpr:'', price, priceExpr:'', amount:(Number(it.qty)||0)*price,
        remark:note||it.remark||'', srcId:it.id,
        ...(it.groupId?{groupId:(gmap[it.groupId]||(gmap[it.groupId]=uid())),groupName:it.groupName||''}:{}) });
      added++;
    });
  });
  // 只剩一道的工序群組沒有分組意義，還原成一般細項
  kid.blocks.forEach(b=>{ const c={}; b.items.forEach(it=>{ if(it.groupId) c[it.groupId]=(c[it.groupId]||0)+1; });
    b.items.forEach(it=>{ if(it.groupId&&c[it.groupId]<2){ delete it.groupId; delete it.groupName; } }); });
  kid.blocks=kid.blocks.filter(b=>b.items.length);

  state.cur=kid.id; state.tab='items'; subPanel=false; save(); render();
  const lines=[];
  if(grown.length) lines.push(`加間數（沿用原單價）：\n${grown.map(x=>'・'+x).join('\n')}`);
  if(added) lines.push(`新帶入 ${added} 條，單價已按母單價 ${Math.round(pct*100)}% 帶好，要再調就直接改。`);
  if(skipped) lines.push(`${skipped} 條之前已帶過，略過。`);
  alert(`${isNew?'已建立':'已更新'}子專案「${kid.name}」，已切換過去。\n\n${lines.join('\n\n')}\n\n回母專案的「發包分配」可以看每條發了幾間、還剩多少。`);
}

      if(it.groupId&&!inBatch){
        if(gDone.has(it.groupId)) continue;   // 同一組只在第一條的位置畫一次
        gDone.add(it.groupId);
        const subs=b.items.filter(x=>x.groupId===it.groupId);
        const gAmt=subs.reduce((s,x)=>s+(Number(x.amount)||0),0);
        const sameQty=subs.every(x=>Number(x.qty)===Number(subs[0].qty));
        const gQty=sameQty?Number(subs[0].qty):0;
        const gPrice=sameQty&&gQty?+(gAmt/gQty).toFixed(4):0;   // 同量時＝各段單價相加
        const open=openGroup.has(it.groupId);
        h+=`<tr style="background:var(--card2)">
          ${picking?`<td><input type="checkbox" data-delpick-group="${it.groupId}" ${subs.every(x=>delSel.has(x.id))?'checked':''} style="width:16px;height:16px"></td>`:''}
          <td>${esc(it.no==='增'?'':it.no)}</td>
          <td><button class="btn sub sm" data-grouptoggle="${it.groupId}" style="border:none;background:none;padding:0 6px 0 0;color:var(--accent)">${open?'▾':'▸'}</button><b>${esc(it.groupName||it.name)}</b>${subs.slice(0,4).map(x=>{const st=stageOf(x.name,it.groupName);const c=stageColor(st);return `<span class="tag" style="background:${c}22;border-color:${c}88;color:${c};margin-left:4px">${esc(st)}</span>`;}).join('')}${subs.length>4?`<span class="tag" title="共 ${subs.length} 道工序">+${subs.length-4}</span>`:''}<span class="tag" style="background:rgba(99,102,241,.22);border-color:rgba(129,140,248,.5);color:#c7d2fe">${subs.length} 道工序</span></td>
          <td>${esc(it.unit)}</td>
          <td class="num">${sameQty?qfmt(gQty):'<span class="muted" style="font-size:11px">各段不同</span>'}</td>
          <td class="num">${sameQty?qfmt(gPrice):'<span class="muted" style="font-size:11px">—</span>'}</td>
          <td class="num"><b>${qfmt(gAmt)}</b></td>
          <td class="muted" style="font-size:12px">${esc(it.remark||'')}</td>
          <td><button class="btn sub sm" data-groupmerge="${b.id}::${it.groupId}" title="取消拆分，合回一條">↩ 合回</button></td></tr>`;
        if(open){
          for(const s of subs){
            if(itemEdit===b.id+'::'+s.id){ h+=itemForm(b,s); continue; }
            h+=`<tr>${picking?`<td><input type="checkbox" data-delpick="${s.id}" ${delSel.has(s.id)?'checked':''} style="width:16px;height:16px"></td>`:''}<td></td>
              <td style="padding-left:26px;color:var(--muted)">↳ ${stageHtml(s.name,it.groupName)}</td>
              <td>${esc(s.unit)}</td>
              <td class="num">${qfmt(s.qty)}${s.qtyExpr?`<div style="font-size:11px;color:var(--muted)">=${esc(s.qtyExpr)}</div>`:''}</td>
              <td class="num">${s.price?qfmt(s.price):''}${s.priceExpr?`<div style="font-size:11px;color:var(--muted)">=${esc(s.priceExpr)}</div>`:''}</td>
              <td class="num">${qfmt(s.amount)}</td>
              <td class="muted" style="font-size:12px">${esc(s.remark||'')}</td>
              <td><button class="btn sub sm" data-edititem="${b.id}::${s.id}">改</button> <button class="btn bad sm" data-delitem="${b.id}::${s.id}">刪</button></td></tr>`;
          }
        }
        continue;
      }
      if(inBatch){
        h+=`<tr>${picking?'<td></td>':''}<td>${esc(it.no)}</td><td>${esc(it.name)}${it.tag?`<span class="tag">${esc(it.tag)}</span>`:''}</td><td>${esc(it.unit)}</td>
          <td class="num"><input class="pin" id="be-qty-${it.id}" inputmode="decimal" value="${esc(String(it.qtyExpr||it.qty))}" style="width:110px;text-align:right" placeholder="可算式"></td>
          <td class="num"><input class="pin" id="be-price-${it.id}" inputmode="decimal" value="${esc(String(it.priceExpr||it.price||''))}" style="width:100px;text-align:right" placeholder="可算式"></td>
          <td class="num" style="color:var(--muted)">${qfmt(it.amount)}</td><td class="muted" style="font-size:12px">${esc(it.remark)}</td><td></td></tr>`;
        continue;
      }
      const zero=it.amount===0;
      h+=`<tr class="${zero?'zero':''}">${picking?`<td><input type="checkbox" data-delpick="${it.id}" ${delSel.has(it.id)?'checked':''} style="width:16px;height:16px"></td>`:''}<td>${esc(it.no)}</td><td>${esc(it.name)}${it.tag?`<span class="tag">${esc(it.tag)}</span>`:''}</td>
        <td>${esc(it.unit)}</td><td class="num">${qfmt(it.qty)}${it.qtyExpr?`<div style="font-size:11px;color:var(--muted)">=${esc(it.qtyExpr)}</div>`:''}</td>
        <td class="num">${it.price?qfmt(it.price):''}${it.priceExpr?`<div style="font-size:11px;color:var(--muted)">=${esc(it.priceExpr)}</div>`:''}</td><td class="num">${qfmt(it.amount)}</td>
        <td class="muted" style="font-size:12px">${esc(it.remark)}</td>
        <td><button class="btn sub sm" data-edititem="${b.id}::${it.id}">改</button> <button class="btn sub sm" data-splititem="${b.id}::${it.id}" title="拆成骨架／封板等多道工序，數量沿用">✂ 拆</button> <button class="btn bad sm" data-delitem="${b.id}::${it.id}">刪</button></td></tr>`;
    }
    if(itemAdd===b.id) h+=itemForm(b,null);
    if(b.items.length>1){
      const subSum=b.items.reduce((s,i)=>s+i.amount,0);
      h+=`<tr class="chapter">${picking?'<td></td>':''}<td colspan="5" style="text-align:right">小計${b.count>1?`（每${esc(b.unit)}）`:''}</td><td class="num"><b>${qfmt(subSum)}</b></td><td colspan="2">${b.count>1?`<span class="muted" style="font-size:11px">×${qfmt(b.count)} ${esc(b.unit)} ＝ ${money(subSum*b.count)}</span>`:''}</td></tr>`;
    }
    const canSort=b.items.length>1;                                  // 一律顯示；按下去若含匯入細項會先確認
    const allManual=b.items.every(it=>it.no==='增');
    const srcBlks=proj.blocks.filter(x=>x.id!==b.id&&x.items.length);
    const runs=detectSplitRuns(b);   // 以前拆過但還沒群組的
    h+=`</table><div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap;align-items:center">`;
    if(batchAll){
      h+=`<span class="muted" style="font-size:12px">數量／單價可直接填算式（例 5.11*3.07）。改完請按上方「💾 全部儲存」。</span>`;
    }else if(batchEdit!==b.id){
      h+=`${runs.length?`<button class="btn sub sm" data-groupdetect="${b.id}" style="border-color:#818cf8;color:#c7d2fe" title="把以前拆開、還沒收在一起的工序群組起來，之後就能展開／合回">🔗 收合舊的拆分（${runs.length} 組）</button>`:''}${itemAdd===b.id?'':`<button class="btn sub sm" data-additem="${b.id}">＋ 手動加細項</button>`}${canSort?`<button class="btn sub sm" data-sortitems="${b.id}" title="依名稱/圖面編號自然排序（A、B…D-1、E…）${allManual?'':'／此區塊含匯入細項，按下會先確認'}">🔤 智慧排序${allManual?'':'<span style="opacity:.6">·含匯入</span>'}</button>`:''}${srcBlks.length&&copyInto!==b.id?`<button class="btn sub sm" data-copyinto="${b.id}">📋 複製細項自其他區塊</button>`:''}${copyInto===b.id?`<span class="muted" style="font-size:12px">從哪個區塊複製：</span><select id="copy-src" style="height:30px">${srcBlks.map(x=>`<option value="${x.id}">${esc(x.name)}（${x.items.length} 條）</option>`).join('')}</select><button class="btn sm" data-copyok="${b.id}">複製過來</button><button class="btn sub sm" data-copycancel="1">取消</button>`:''}`;
    }
    h+=`</div></div></details>`;
  }
  h+=blkAdd
    ?`<div class="rowline" style="flex-wrap:wrap;gap:8px;align-items:flex-end;margin-top:6px;padding:10px;background:var(--bg,#f8fafc);border-radius:10px">
      ${fld('區塊名稱',`<input id="ba-name" style="${ist};min-width:180px" placeholder="例：客房隔間">`)}
      ${fld('單位',`<input id="ba-unit" value="間" style="${ist};width:70px">`)}
      ${fld('合約數量',`<input id="ba-count" type="number" inputmode="decimal" value="1" style="${ist};width:90px">`)}
      <button class="btn sm" id="btn-addblk-ok">建立區塊</button><button class="btn sub sm" data-blkcancel="1">取消</button></div>`
    :`<button class="btn sub" id="btn-addblk">＋ 手動加區塊</button>`;
  return h;
}

function viewProg(proj){
  if(!proj.periods.length){
    return `<div class="card" style="text-align:center;padding:34px">
      <div style="margin-bottom:12px">還沒有請款期別。建立第 1 期後，填各細項的完成量或百分比，程式會自動算請款金額。</div>
      <button class="btn" id="btn-addperiod">＋ 建立第 1 期</button></div>`;
  }
  const perIdx=Math.min(proj.curPeriod??proj.periods.length-1,proj.periods.length-1);
  const c=calc(proj,perIdx);
  const period=c.period;
  const editable=perIdx===proj.periods.length-1;
  let h=`<div class="rowline">
    <select id="period-sel">${proj.periods.map((p,i)=>`<option value="${i}"${i===perIdx?' selected':''}>第 ${p.no} 期（${esc(p.date)}）</option>`).join('')}</select>
    ${editable?`<input type="date" id="period-date" value="${esc(period.date)}">`:''}
    <button class="btn sub sm" id="btn-addperiod">＋ 新增一期</button>
    ${editable&&proj.periods.length?`<button class="btn bad sm" id="btn-delperiod">刪除本期</button>`:''}
    <span style="flex:1"></span>
    <label class="muted" style="font-size:13px;cursor:pointer"><input type="checkbox" id="hide-zero"${proj.hideZero?' checked':''}> 隱藏 0 元項目</label>
    <button class="btn" id="btn-print">🖨 列印請款單</button>
  </div>
  ${editable?'':'<div class="notice">這是舊期別，唯讀。要修改請切到最新一期。</div>'}
  <div class="grid" style="margin-bottom:12px">
    <div class="stat"><div class="l">累計完成計價${c.discount?'（折讓後）':''}</div><div class="v" data-c="g-applied">${money(c.cumApplied)}</div><div class="l">占合約 <span data-c="g-pct">${pfmt(c.V?c.itemCum/c.V:0)}</span></div></div>
    <div class="stat"><div class="l">前期累計已收</div><div class="v" data-c="g-pre">${money(c.billPre)}</div></div>
    <div class="stat" style="border-color:#2563eb"><div class="l">本次實請金額</div><div class="v ok" data-c="g-this">${money(c.billActual)}</div>${c.billRound?`<div class="l">尾差 <span data-c="g-round">${moneyS(c.billRound)}</span></div>`:''}</div>
  </div>`;
  // ── 已收款明細（訂金＋前期各期）──
  h+=`<div class="card" style="margin-bottom:12px"><h3>已收款明細（前期請款）</h3>`;
  if(c.receivedList.length){
    h+=`<table style="margin-bottom:6px"><tr><th>日期</th><th>項目</th><th class="num">金額</th></tr>`;
    for(const r of c.receivedList) h+=`<tr><td>${esc(r.date||'')}</td><td>${esc(r.label)}</td><td class="num">${money(r.amount)}</td></tr>`;
    h+=`<tr class="chapter"><td>前期累計已收 小計（本次會扣）</td><td></td><td class="num"><b>${money(c.billPre)}</b></td></tr></table>`;
  }else{ h+=`<div class="muted" style="font-size:13px;margin-bottom:8px">目前尚無會扣抵的已收款。</div>`; }
  if(c.noteList.length){
    h+=`<div style="font-size:12.5px;font-weight:600;margin-top:6px">已收但本次不扣（僅紀錄）</div><table style="margin-bottom:6px"><tr><th>日期</th><th>項目</th><th class="num">金額</th></tr>`;
    for(const r of c.noteList) h+=`<tr><td>${esc(r.date||'')}</td><td>${esc(r.label)}</td><td class="num">${money(r.amount)}</td></tr>`;
    h+=`</table>`;
  }
  // ── 額外款項（訂金／加項）──
  const myExtras=extrasOf(period).filter(e=>!e.auto);
  h+=`<div style="margin-top:6px;font-size:13px;font-weight:600">本期登錄款項</div>
    <div class="muted" style="font-size:12px;margin-bottom:6px"><b>已收款（訂金／前期請款）</b>＝業主之前付過的，會列進「前期累計已收」給業主看，並自動從本次請款扣掉；<b>加項</b>＝額外追加工程，加到本次請款。</div>`;
  if(myExtras.length){
    h+=`<table style="margin-bottom:8px"><tr><th>名目</th><th class="num">日期</th><th>性質</th><th class="num">金額</th>${editable?'<th></th>':''}</tr>`;
    for(const e of myExtras){
      const kindTag=!e.deduct?'<span class="tag" style="background:#dbeafe;color:#1e3a8a">加項</span>':e.recordOnly?'<span class="tag" style="background:#fef3c7;color:#92400e">已收·僅紀錄</span>':'<span class="tag" style="background:#dcfce7;color:#166534">已收·扣抵</span>';
      h+=`<tr><td>${esc(e.name||'訂金')}${e.days?`<span class="tag" title="點工計價" style="background:rgba(45,212,191,.18);border-color:rgba(45,212,191,.5);color:#5eead4">${qfmt(e.days)} 工 × ${money(e.rate)}</span>`:''}</td><td class="num">${esc(e.date||period.date)}</td><td>${kindTag}</td><td class="num">${money(e.amount)}</td>${editable?`<td class="num"><button class="btn sub sm" data-editextra="${e.id}">改</button> <button class="btn bad sm" data-delextra="${e.id}">刪</button></td>`:''}</tr>`;
    }
    h+=`</table>`;
  }else{ h+=`<div class="muted" style="font-size:13px;margin-bottom:8px">本期尚無登錄款項。</div>`; }
  if(editable)h+=`<button class="btn sub sm" id="btn-addextra">＋ 新增訂金／加項</button> <button class="btn sub sm" id="btn-roundup">🎯 湊整本次到整數</button>`;
  // 本次請款計算
  h+=`<div style="margin-top:12px;padding-top:10px;border-top:1px dashed var(--line);font-size:14px">
    <div style="display:flex;justify-content:space-between"><span>累計完成計價${c.discount?'（依簽約總價分攤）':''}</span><b>${money(c.cumApplied)}</b></div>
    ${c.discount?`<div class="muted" style="font-size:11px;margin-top:2px">＊已按簽約總價 ${money(c.signedTotal)} 比例分攤（明細總額 ${money(c.V)}）</div>`:''}
    ${c.billPre?`<div style="display:flex;justify-content:space-between;color:var(--muted)"><span>減 前期累計已收</span><span>−${money(c.billPre).slice(1)}</span></div>
    <div style="display:flex;justify-content:space-between"><span>本次應請（計算）</span><b>${money(c.billComputed)}</b></div>`:''}
    ${c.billRound?`<div style="display:flex;justify-content:space-between;color:var(--muted)"><span>尾差調整（湊整）</span><span>${moneyS(c.billRound)}</span></div>`:''}
    <div style="display:flex;justify-content:space-between;font-size:16px;margin-top:4px;color:var(--accent2)"><span><b>本次實請金額</b></span><b data-c="g-actual">${money(c.billActual)}</b></div>
    ${(()=>{ const wp=Math.max(0,Number(proj.withholdPct)||0), rp=Math.max(0,Number(proj.retainPct)||0);
      const wh=Math.round(c.billActual*wp/100), rt=retainOf(proj,period,c.billActual);
      const fixed=(period.rtAmt!==undefined&&period.rtAmt!=='');
      if(!wp&&!rp&&!fixed) return editable?`<div style="margin-top:6px"><button class="btn sub sm" id="btn-setretain">＋ 設定本期保留款金額</button></div>`:'';
      return (wp?`<div style="display:flex;justify-content:space-between;color:#fca5a5"><span>代扣所得稅 ${wp}%</span><span>−${money(wh).slice(1)}</span></div>`:'')
        +((rt>0||fixed)
          ?`<div style="display:flex;justify-content:space-between;color:#fbbf24"><span>保留款${fixed?'（直接指定）':` ${rp}%`}${editable?` <button class="btn sub sm" id="btn-setretain" style="font-size:10px;padding:0 6px;height:20px">改金額</button>`:''}</span><span>−${money(rt).slice(1)}</span></div>`
          :(editable?`<div style="text-align:right;margin:2px 0"><button class="btn sub sm" id="btn-setretain" style="font-size:10px;padding:0 8px;height:22px">＋ 設保留款金額</button></div>`:''))
        +`<div style="display:flex;justify-content:space-between;font-size:15px"><span><b>本次實付</b></span><b>${money(c.billActual-wh-rt)}</b></div>`
        +(editable&&!fixed&&rp>0?`<div class="muted" style="font-size:11px;text-align:right">想湊整數就按「改金額」直接填保留款</div>`:''); })()}
  </div>`;
  h+=`</div>`;
  // ── 代扣稅款追蹤（廠商還沒公司登記時暫扣，補開發票後回補）──
  {
    const wp=Math.max(0,Number(proj.withholdPct)||0), rp=Math.max(0,Number(proj.retainPct)||0);
    const anyRt=rp>0||proj.periods.some(pp=>pp.rtAmt!==undefined&&pp.rtAmt!=='');
    if(wp>0||anyRt){
      // 補稅：談未稅價時，廠商日後補開發票你要另外補的營業稅（列印已是「外加5%」則不需要）
      const itPct=(proj.taxMode==='incl')?0:Math.max(0,proj.invoiceTaxPct!==undefined?Number(proj.invoiceTaxPct):5);
      const rows=proj.periods.map((pp,i)=>{
        const cc=calc(proj,i);
        const it=(wp>0&&itPct>0)?(pp.whTaxAdd!==undefined?Math.round(Number(pp.whTaxAdd)||0):Math.round(cc.billActual*itPct/100)):0;
        return {i,pp,base:cc.billActual,wh:Math.round(cc.billActual*wp/100),rt:retainOf(proj,pp,cc.billActual),it};
      }).filter(x=>x.wh>0||x.rt>0);
      const whPend=rows.filter(x=>!x.pp.whRefunded).reduce((s,x)=>s+x.wh,0);
      const whBack=rows.filter(x=>x.pp.whRefunded).reduce((s,x)=>s+x.wh,0);
      const itPend=rows.filter(x=>!x.pp.whRefunded).reduce((s,x)=>s+x.it,0);
      const rtPend=rows.filter(x=>!x.pp.rtReleased).reduce((s,x)=>s+x.rt,0);
      const rtBack=rows.filter(x=>x.pp.rtReleased).reduce((s,x)=>s+x.rt,0);
      h+=`<div class="card" style="margin-bottom:12px"><h3>扣款追蹤${wp?`　代扣 ${wp}%`:''}${rp?`　保留款 ${rp}%`:''}</h3>
        <div class="muted" style="font-size:12.5px;margin-bottom:8px">${[wp?`<b>代扣稅</b>：廠商取得公司登記、補開發票後回補`:'',rp?`<b>保留款</b>：完工驗收後放款（金額可直接改，湊整用）`:''].filter(Boolean).join('；')}。下面就是你總共還欠廠商多少。</div>
        <div class="grid" style="margin-bottom:8px">
          ${wp?`<div class="stat"><div class="l">代扣·未回補</div><div class="v" style="color:#fca5a5">${money(whPend)}</div>${whBack?`<div class="l">已回補 ${money(whBack)}</div>`:''}</div>`:''}
          ${itPend?`<div class="stat"><div class="l">補稅·待付（補開發票後）</div><div class="v" style="color:var(--accent2)">${money(itPend)}</div></div>`:''}
          ${anyRt?`<div class="stat"><div class="l">保留款·未放款</div><div class="v" style="color:var(--warn)">${money(rtPend)}</div>${rtBack?`<div class="l">已放款 ${money(rtBack)}</div>`:''}</div>`:''}
          <div class="stat" style="border-color:#3b82f6"><div class="l">合計還欠廠商</div><div class="v">${money(whPend+itPend+rtPend)}</div></div>
        </div>
        ${rows.length?`<div class="scroll"><table><tr><th>期別</th><th>日期</th><th class="num">該期實請</th>${wp?`<th class="num">代扣 ${wp}%</th>`:''}${(wp&&itPct)?`<th class="num">補稅 ${itPct}%</th>`:''}${wp?`<th>代扣狀態</th>`:''}${anyRt?`<th class="num">保留款</th><th>保留款狀態</th>`:''}</tr>
        ${rows.map(x=>`<tr><td>第 ${x.pp.no} 期</td><td>${esc(x.pp.date||'')}</td><td class="num">${money(x.base)}</td>
          ${wp?`<td class="num">${money(x.wh)}</td>`:''}
          ${(wp&&itPct)?`<td class="num"><input class="pin" data-whtax="${x.i}" inputmode="decimal" value="${x.it}" style="width:84px;text-align:right"></td>`:''}
          ${wp?`<td>${x.pp.whRefunded
            ? `<span class="tag" style="background:rgba(52,211,153,.18);border-color:rgba(52,211,153,.5);color:#6ee7b7">已回補 ${esc(x.pp.whRefundDate||'')}</span> <button class="btn sub sm" data-whtoggle="${x.i}">取消</button>`
            : `<button class="btn sm" data-whtoggle="${x.i}">標記已回補</button>`}</td>`:''}
          ${anyRt?`<td class="num"><input class="pin" data-rtamt="${x.i}" inputmode="decimal" value="${x.rt}" style="width:92px;text-align:right"></td><td>${x.pp.rtReleased
            ? `<span class="tag" style="background:rgba(52,211,153,.18);border-color:rgba(52,211,153,.5);color:#6ee7b7">已放款 ${esc(x.pp.rtReleaseDate||'')}</span> <button class="btn sub sm" data-rttoggle="${x.i}">取消</button>`
            : `<button class="btn sm" data-rttoggle="${x.i}">標記已放款</button>`}</td>`:''}
        </tr>`).join('')}
        </table></div>`:'<div class="muted" style="font-size:13px">尚無扣款紀錄。</div>'}
      </div>`;
    }
  }
  for(const cb of c.blocks){
    const b=cb.blk;
    h+=`<details class="blk"${openBlk.has(b.id)?' open':''} data-blk="${b.id}"><summary>
      <b>${esc(b.name)}</b><span class="tag">${qfmt(b.count)} ${esc(b.unit)}</span>
      <span style="flex:1"></span>
      <span class="muted" style="font-size:12.5px">本期 <b class="ok" data-c="bt-${b.id}">${money(cb.thisAmt)}</b>｜累計 <span data-c="bc-${b.id}">${money(cb.cum)}</span> / ${money(cb.V)}（<span data-c="bp-${b.id}">${pfmt(cb.V?cb.cum/cb.V:0)}</span>）</span></summary>
    <div class="inner">`;
    if(editable&&b.count>1){
      h+=`<div class="rowline" style="margin:4px 0 8px">
        <span class="muted" style="font-size:13px">整批填：完成</span>
        <input class="pin" data-bfill="${b.id}" inputmode="decimal" placeholder="0"> <span class="muted">/ ${qfmt(b.count)} ${esc(b.unit)}</span>
        <button class="btn sub sm" data-bapply="${b.id}">套用到整個區塊</button>
        <span class="muted" style="font-size:12px">（會把區塊內每條細項的完成％都設成 完成${esc(b.unit)}數 ÷ ${qfmt(b.count)}，之後仍可逐條微調）</span></div>`;
    }
    // 邊做邊發包的用法：這期工班又做好幾間才把量加進來，一個動作把「間數 +N」與
    // 「本期做完」一起做掉，省得先去合約明細改間數、再回來填進度。
    if(editable&&proj.parentId){
      h+=`<div class="rowline" style="margin:4px 0 8px;padding:6px 8px;background:rgba(52,211,153,.10);border:1px solid rgba(52,211,153,.4);border-radius:8px">
        <span style="font-size:13px"><b>本期又做好</b></span>
        <input class="pin" data-gfill="${b.id}" inputmode="decimal" placeholder="0" style="width:70px"> <span class="muted">${esc(b.unit)}</span>
        <button class="btn sm" data-gapply="${b.id}" style="background:#059669;border-color:#059669">＋ 加進來並記為完成</button>
        <span class="muted" style="font-size:12px">合約${esc(b.unit)}數 ${qfmt(b.count)} → 加完變 <b data-gnew="${b.id}">${qfmt(b.count)}</b>，本期累計完成也一併補到滿。舊期已請的金額不動。</span></div>`;
    }
    const hasR=b.count>1;const cols=hasR?9:9;
    h+=`<table><tr><th>項次</th><th>名稱及規格</th><th>單位</th><th class="num">數量</th><th class="num">單價</th><th class="num">前期%</th><th class="num">${hasR?`完成${esc(b.unit)}數`:'累計完成量'}</th><th class="num">累計%</th><th class="num">本期金額</th></tr>`;
    let ch='', gDone=new Set();
    for(const ci of cb.items){
      const it=ci.it;
      if(proj.hideZero&&ci.v===0)continue;
      if(it.chapter!==ch){ch=it.chapter;if(ch)h+=`<tr class="chapter"><td colspan="${cols}">${esc(ch)}</td></tr>`;}
      // ── 拆開的工序：收在原本那條底下（同合約明細），可展開逐道填進度 ──
      if(it.groupId){
        if(gDone.has(it.groupId)) continue;
        gDone.add(it.groupId);
        const g=cb.items.filter(x=>x.it.groupId===it.groupId);
        const gV=g.reduce((s,x)=>s+x.v,0), gCum=g.reduce((s,x)=>s+x.cumAmt,0);
        const gPre=g.reduce((s,x)=>s+x.preAmt,0), gThis=g.reduce((s,x)=>s+x.thisAmt,0);
        const open=openGroup.has(it.groupId);
        h+=`<tr style="background:var(--card2)">
          <td>${esc(it.no==='增'?'':it.no)}</td>
          <td><button class="btn sub sm" data-grouptoggle="${it.groupId}" style="border:none;background:none;padding:0 6px 0 0;color:var(--accent)">${open?'▾':'▸'}</button><b>${esc(it.groupName||it.name)}</b>${g.slice(0,4).map(x=>{const st=stageOf(x.it.name,it.groupName);const c=stageColor(st);const done=x.p>=0.999;return `<span class="tag" title="${done?'已完成':'完成 '+pfmt(x.p)}" style="background:${c}22;border-color:${c}88;color:${c};margin-left:4px">${esc(st)}${done?' ✓':''}</span>`;}).join('')}${g.length>4?`<span class="tag" title="共 ${g.length} 道工序">+${g.length-4}</span>`:''}<span class="tag" style="background:rgba(99,102,241,.22);border-color:rgba(129,140,248,.5);color:#c7d2fe">${g.length} 道工序</span></td>
          <td>${esc(it.unit)}</td>
          <td class="num">${qfmt(it.qty)}</td>
          <td class="num">${qfmt(g.reduce((s,x)=>s+(Number(x.it.price)||0),0))}</td>
          <td class="num muted">${pfmt(gV?gPre/gV:0)}</td>
          <td class="num muted" style="font-size:12px">${open?'逐道填 ↓':'展開填'}</td>
          <td class="num"><b>${pfmt(gV?gCum/gV:0)}</b></td>
          <td class="num" data-c="tg-${it.groupId}"><b>${gThis?money(gThis):'—'}</b></td></tr>`;
        if(open){
          for(const s of g){
            const si=s.it, sz=s.v===0, stq=itemTotalQty(si,b), spr=progOf(period,si.id);
            const srVal=(spr.exprKind==='r'&&spr.expr)?spr.expr:(spr.p?+(spr.p*b.count).toFixed(2):'');
            h+=`<tr class="${sz?'zero':''}"><td></td>
              <td style="padding-left:26px;color:var(--muted)">↳ ${stageHtml(si.name,it.groupName)}</td>
              <td>${esc(si.unit)}</td><td class="num">${qfmt(si.qty)}</td><td class="num">${si.price?qfmt(si.price):''}</td>
              <td class="num muted">${pfmt(s.pp)}</td>
              <td class="num">${hasR
                ?(editable&&!sz?`<input class="pin pct" data-r="${b.id}::${si.id}" inputmode="decimal" value="${srVal}" placeholder="0">`:(srVal||'—'))
                :(editable&&!sz?`<input class="pin" data-q="${b.id}::${si.id}" inputmode="decimal" value="${(spr.exprKind==='q'&&spr.expr)?esc(spr.expr):(spr.p?qfmt(spr.q||stq*spr.p):'')}" placeholder="0">`:qfmt(spr.q||stq*spr.p))}</td>
              <td class="num">${editable&&!sz?`<input class="pin pct" data-p="${b.id}::${si.id}" inputmode="decimal" value="${spr.p?+(spr.p*100).toFixed(1):''}" placeholder="0">`:pfmt(s.p)}</td>
              <td class="num" data-c="ti-${si.id}">${s.thisAmt?money(s.thisAmt):'—'}</td></tr>`;
          }
        }
        continue;
      }
      const zero=ci.v===0;
      const tq=itemTotalQty(it,b);
      const pr=progOf(period,it.id);
      const rVal=(pr.exprKind==='r'&&pr.expr)?pr.expr:(pr.p?+(pr.p*b.count).toFixed(2):'');
      h+=`<tr class="${zero?'zero':''}"><td>${esc(it.no)}</td><td>${esc(it.name)}</td><td>${esc(it.unit)}</td>
        <td class="num">${qfmt(it.qty)}</td><td class="num">${it.price?qfmt(it.price):''}</td>
        <td class="num muted">${pfmt(ci.pp)}</td>
        <td class="num">${hasR
          ?(editable&&!zero?`<input class="pin pct" data-r="${b.id}::${it.id}" inputmode="decimal" value="${rVal}" placeholder="0">`:(rVal||'—'))
          :(editable&&!zero?`<input class="pin" data-q="${b.id}::${it.id}" inputmode="decimal" value="${(pr.exprKind==='q'&&pr.expr)?esc(pr.expr):(pr.p?qfmt(pr.q||tq*pr.p):'')}" placeholder="0">`:qfmt(pr.q||tq*pr.p))}</td>
        <td class="num">${editable&&!zero?`<input class="pin pct" data-p="${b.id}::${it.id}" inputmode="decimal" value="${pr.p?+(pr.p*100).toFixed(1):''}" placeholder="0">`:pfmt(ci.p)}</td>
        <td class="num" data-c="ti-${it.id}">${ci.thisAmt?money(ci.thisAmt):'—'}</td></tr>`;
    }
    h+=`</table></div></details>`;
  }
  return h;
}

function viewAlloc(proj){
  const al=allocationOf(proj);
  let h=`<div class="grid" style="margin-bottom:12px">
    <div class="stat"><div class="l">母專案總額（發包預算）</div><div class="v">${money(al.totMother)}</div></div>
    <div class="stat"><div class="l">已發包</div><div class="v" style="color:${al.totAlloc>al.totMother?'#fca5a5':'inherit'}">${money(al.totAlloc)}</div></div>
    <div class="stat"><div class="l">自辦（自己做）</div><div class="v" style="color:var(--accent2)">${money(al.totSelf)}</div></div>
    <div class="stat"><div class="l">還沒決定</div><div class="v" style="color:${al.totLeft<0?'#fca5a5':'var(--ok)'}">${money(al.totLeft)}</div></div>
  </div>`;
  if(al.over){
    h+=`<div class="notice" style="border-color:rgba(248,113,113,.55);background:rgba(248,113,113,.12);color:#fca5a5;margin-bottom:10px">
      <b>⚠ 有 ${al.over} 條細項的發包量超過母專案</b>——通常是複製子專案後沒刪乾淨、同一條被發包給兩家。下面紅底的就是，請到該子專案把多的刪掉或改數量。</div>`;
  }
  if(al.orphans.length){
    const refs=al.orphans.flatMap(o=>o.refs||[]);
    const matchable=refs.filter(r=>proj.blocks.some(b=>b.items.some(it=>it.name===r.name))).length;
    h+=`<div class="notice" style="border-color:rgba(251,191,36,.5);background:rgba(251,191,36,.12);color:#fcd34d;margin-bottom:10px">
      <b>⚠ 有 ${refs.length} 條發包細項對應不到母專案</b>（合計 ${money(al.orphanAmt)}）——多半是母專案那條後來被<b>拆開或改名、刪掉</b>了，所以這些錢沒被算進上面的「已發包」。
      <div class="scroll" style="margin-top:6px"><table style="font-size:12px"><tr><th>子專案</th><th>區塊</th><th>細項名稱</th><th class="num">金額</th><th>母專案有同名嗎</th></tr>
      ${refs.map(r=>{ const hit=proj.blocks.some(b=>b.items.some(it=>it.name===r.name));
        return `<tr><td><span class="tag" style="cursor:pointer" data-gotoproj="${r.projId}">${esc(r.projName)}</span></td><td>${esc(r.blkName)}</td><td>${esc(r.name)}</td><td class="num">${money(r.amount)}</td>
        <td>${hit?'<span style="color:#6ee7b7">✓ 有，可自動接回</span>':'<span style="color:#fca5a5">✗ 沒有同名</span>'}</td></tr>`; }).join('')}
      </table></div>
      <div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap;align-items:center">
        ${matchable?`<button class="btn sm" id="orphan-fix">🔧 自動接回（${matchable} 條）</button>`:''}
        <button class="btn sub sm" id="orphan-detach">標為「額外項目」（不對應母專案）</button>
        <span class="muted" style="font-size:11.5px">找不到同名時：可到母專案把那條加回來，或標為額外項目就不再提醒。</span>
      </div></div>`;
  }
  h+=`<div class="muted" style="font-size:12.5px;margin-bottom:8px">母專案設定<b>發包總量與單價</b>；每個廠商子專案認領的部分列在「已分配」。<b>自辦</b>欄填自己要做的部分：<b>上格填間數</b>（自己做 5 間就填 5），或<b>下格直接填量</b>（㎡、式…），兩格連動，<b>還沒決定</b>＝母總量−已發包−自辦。<b>已發包＋自辦不可超過母專案</b>，超了會標紅。</div>
    <div style="margin-bottom:8px"><button class="btn sub sm" data-selfrest="1" title="把每條「還沒決定」的量全部歸為自辦">🙋 把剩下的全部設為自辦</button> <button class="btn sub sm" data-selfclear="1">清除所有自辦</button></div>`;
  let curBlk=null;
  h+=`<table><tr><th>細項</th><th class="num">母·總量</th><th class="num">已分配量</th><th class="num">自辦（間數／量）</th><th class="num">還沒決定</th><th>分給誰</th><th class="num">母·金額</th><th class="num">已發包金額</th></tr>`;
  for(const r of al.rows){
    if(curBlk!==r.blk.id){ curBlk=r.blk.id; h+=`<tr class="chapter"><td colspan="8">${esc(r.blk.name)}（${qfmt(r.blk.count)} ${esc(r.blk.unit)}）</td></tr>`; }
    const zero=r.aQty===0;
    h+=`<tr${r.over?' style="background:rgba(248,113,113,.10)"':''}>
      <td>${esc(r.it.name)}${r.over?'<span class="tag" style="background:rgba(248,113,113,.22);border-color:rgba(248,113,113,.5);color:#fca5a5">超額</span>':''}</td>
      <td class="num">${qfmt(r.mQty)} ${esc(r.it.unit)}</td>
      <td class="num">${r.aQty?qfmt(r.aQty):'—'}</td>
      <td class="num">${(Number(r.blk.count)||0)>1
        ? `<div style="display:flex;gap:4px;justify-content:flex-end;align-items:center"><input class="pin" data-selfrooms="${r.blk.id}::${r.it.id}" inputmode="decimal" value="${r.selfQty&&Number(r.it.qty)?qfmt(+(r.selfQty/Number(r.it.qty)).toFixed(4)):''}" placeholder="0" title="填間數（例：自己做 5 間就填 5）" style="width:52px;text-align:right"><span style="font-size:10.5px;color:var(--muted)">${esc(r.blk.unit)}</span></div>
           <div style="display:flex;gap:4px;justify-content:flex-end;align-items:center;margin-top:2px"><input class="pin" data-selfqty="${r.blk.id}::${r.it.id}" inputmode="decimal" value="${r.selfQty?qfmt(r.selfQty):''}" placeholder="0" title="或直接填量" style="width:52px;text-align:right"><span style="font-size:10.5px;color:var(--muted)">${esc(r.it.unit)}</span></div>`
        : `<input class="pin" data-selfqty="${r.blk.id}::${r.it.id}" inputmode="decimal" value="${r.selfQty?qfmt(r.selfQty):''}" placeholder="0" style="width:76px;text-align:right">`}
        ${r.selfQty?`<div style="font-size:10.5px;color:var(--accent2)">${money(r.selfAmt)}</div>`:''}</td>
      <td class="num" style="color:${r.leftAmt<0?'#fca5a5':(r.leftAmt>0?'var(--muted)':'inherit')}">${money(r.leftAmt)}${r.leftQty>0?`<div style="font-size:10.5px;color:var(--muted)"><button class="btn sub sm" data-selfone="${r.blk.id}::${r.it.id}" style="font-size:10px;padding:0 6px;height:20px">設為自辦</button></div>`:''}</td>
      <td style="font-size:12px">${r.by.length?r.by.map(x=>`<span class="tag" style="cursor:pointer" data-gotoproj="${x.id}">${esc(x.name)} ${money(x.amount)}</span>`).join(' '):(r.selfQty>=r.mQty-0.0001?'<span class="tag" style="background:rgba(96,165,250,.2);border-color:rgba(96,165,250,.5);color:#bfdbfe">自辦</span>':'<span class="muted">尚未發包</span>')}</td>
      <td class="num">${money(r.mAmt)}</td>
      <td class="num"${r.over?' style="color:#fca5a5;font-weight:700"':(zero?' class="muted"':'')}>${zero?'—':money(r.aAmt)}</td></tr>`;
  }
  h+=`<tr class="chapter"><td>合計</td><td></td><td></td><td class="num"><b style="color:var(--accent2)">${money(al.totSelf)}</b></td><td class="num"><b>${money(al.totLeft)}</b></td><td></td><td class="num"><b>${money(al.totMother)}</b></td><td class="num"><b style="color:${al.totAlloc>al.totMother?'#fca5a5':'inherit'}">${money(al.totAlloc)}</b></td></tr></table>`;
  h+=`<div class="card" style="margin-top:12px"><h3>各廠商子專案</h3>
    <div class="muted" style="font-size:12px;margin-bottom:6px">「加項」＝該子專案各期登錄的點工／修繕等不按量算的錢，不在合約明細裡，所以不算進上面的發包量管控，但一樣要付。</div>
    <table><tr><th>廠商子專案</th><th>廠商</th><th class="num">發包金額</th><th class="num">加項（點工等）</th><th class="num">合計</th><th></th></tr>
    ${al.kids.map(k=>{ const v=k.blocks.reduce((s,b)=>s+b.items.reduce((x,i)=>x+itemValue(i,b),0),0);
      const ch=projChargeTotal(k);
      return `<tr><td>${esc(k.name)}</td><td>${esc(k.vendor||'—')}</td><td class="num">${money(v)}</td>
        <td class="num">${ch.sum?`${money(ch.sum)}${ch.days?`<div style="font-size:10.5px;color:var(--muted)">${qfmt(ch.days)} 工</div>`:''}`:'<span class="muted">—</span>'}</td>
        <td class="num"><b>${money(v+ch.sum)}</b></td>
        <td><button class="btn sub sm" data-gotoproj="${k.id}">開啟</button></td></tr>`; }).join('')}
    </table></div>`;
  return h;
}

    <div class="rowline">工程名稱 <input id="set-name" style="min-width:320px" value="${esc(proj.name)}"></div>
    <div class="rowline">業主／甲方 <input id="set-owner" style="min-width:220px" value="${esc(proj.owner||'')}" placeholder="請款對象"></div>
